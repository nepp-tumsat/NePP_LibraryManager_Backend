services:
  db:
    image: postgres:16
    env_file:
      - ../.env
    volumes:
      - db-store:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    environment:
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: 1025
    volumes:
      - ..:/workspaces/rails_app:cached
    working_dir: /workspaces/rails_app
    command: sleep infinity
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  db-store:
