name: "Ruby on Rails CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: rails_test
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: password
        # 起動待ち（ヘルスチェック）
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -p 5432 -U rails -d rails_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      RAILS_ENV: test
      DATABASE_URL: "postgres://rails:password@localhost:5432/rails_test"
      # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}  # ← 使っていれば有効化
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true  # Gemfile.lock をキーに自動キャッシュ

      - name: Wait for DB (extra guard)
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U rails -d rails_test && break
            sleep 1
          done

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run tests
        run: bin/rake

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruby and gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate binstubs
        run: bundle binstubs bundler-audit brakeman rubocop
        # ↑ これらのgemが Gemfile に無いと失敗します

      - name: Security audit dependencies
        run: bin/bundler-audit --update

      - name: Security audit application code
        run: bin/brakeman -q -w2

      - name: Lint Ruby files
        run: bin/rubocop --parallel
